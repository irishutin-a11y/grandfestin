  <g stroke="#ffffff" stroke-opacity="0.22"><line x1="360" y1="905" x2="360" y2="1035"/><line x1="720" y1="905" x2="720" y2="1035"/><line x1="1080" y1="905" x2="1080" y2="1035"/></g>

  <!-- ================= INTRO + PILIERS ================= -->
  <rect x="0" y="1080" width="1440" height="480" fill="#F7F3EC"/>
  <text x="64" y="1168" fill="#1D6B78" font-size="14" letter-spacing="3" font-weight="700">L’ASSOCIATION FESTIN</text>
  <text x="62" y="1232" fill="#0D2B30" font-size="46" font-weight="700" letter-spacing="-1">Former, inclure,</text>
  <text x="62" y="1288" fill="#E8A825" font-size="46" font-weight="700" font-style="italic" letter-spacing="-1">transformer.</text>
  <text x="64" y="1348" fill="#3D5E63" font-size="18">Née à Marseille en 2015, Festin a construit un</text>
  <text x="64" y="1376" fill="#3D5E63" font-size="18">écosystème unique : des dispositifs de formation,</text>
  <text x="64" y="1404" fill="#3D5E63" font-size="18">d’insertion et de plaidoyer qui font de la cuisine</text>
  <text x="64" y="1432" fill="#3D5E63" font-size="18">un puissant levier d’émancipation.</text>

