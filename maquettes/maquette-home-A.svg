  <text x="812" y="50" fill="#ffffff" fill-opacity="0.85" font-size="15">Association</text>
  <text x="930" y="50" fill="#ffffff" fill-opacity="0.85" font-size="15">Formations</text>
  <text x="1048" y="50" fill="#ffffff" fill-opacity="0.85" font-size="15">Projets</text>
  <text x="1132" y="50" fill="#ffffff" fill-opacity="0.85" font-size="15">Impact</text>
  <text x="1210" y="50" fill="#ffffff" fill-opacity="0.85" font-size="15">Contact</text>
  <rect x="1288" y="28" width="88" height="34" rx="17" fill="#E8A825"/>
  <text x="1332" y="50" text-anchor="middle" fill="#0D2B30" font-size="13" font-weight="700">Agir</text>

  <text x="64" y="250" fill="#F5C84A" font-size="15" letter-spacing="3" font-weight="700">ASSOCIATION FESTIN — DEPUIS 2015</text>
  <text x="60" y="378" fill="#ffffff" font-size="132" font-weight="700" letter-spacing="-3">Le goût</text>
  <text x="60" y="506" fill="#ffffff" font-size="132" font-weight="700" letter-spacing="-3">d’avancer</text>
  <text x="60" y="634" fill="#F5C84A" font-size="132" font-weight="700" font-style="italic" letter-spacing="-3">ensemble</text>
  <text x="64" y="694" fill="#ffffff" fill-opacity="0.9" font-size="24">La restauration comme levier d’insertion, de formation</text>
  <text x="64" y="726" fill="#ffffff" fill-opacity="0.9" font-size="24">et de transformation.</text>
  <rect x="64" y="762" width="290" height="52" rx="6" fill="#E8A825"/>
