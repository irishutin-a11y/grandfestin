<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4720" viewBox="0 0 1440 4720" font-family="KoHo, 'Trebuchet MS', 'Segoe UI', sans-serif" role="img" aria-label="Maquette home Festin — Direction A : photo pleine largeur et très grande typographie">
  <title>Festin — Direction A</title>
  <desc>Comp home page : hero photo plein cadre avec titre display géant, bande d'impact chiffrée, écosystème des 5 projets en bandes photo alternées, deux publics, témoignages, engagement, partenaires et financeurs.</desc>
  <defs>
