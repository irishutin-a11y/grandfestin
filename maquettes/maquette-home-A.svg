  <text x="64" y="2188" fill="#0D2B30" font-size="30" font-weight="700">Les Beaux Mets</text>
  <text x="64" y="2224" fill="#3D5E63" font-size="17">Le premier restaurant en prison ouvert au public en France.</text>
