  <rect x="64" y="3690" width="656" height="180" fill="#0F3C44"/>
  <text x="96" y="3742" fill="#F5C84A" font-size="40" font-weight="700">“</text>
  <text x="96" y="3766" fill="#ffffff" font-size="17">Je suis fière, indépendante, heureuse d’avoir su</text>
  <text x="96" y="3792" fill="#ffffff" font-size="17">franchir toutes ces étapes.</text>
  <text x="96" y="3838" fill="#9FE1CB" font-size="13" font-weight="700">Promotion Des Étoiles et des Femmes, Lille</text>
  <rect x="740" y="3690" width="636" height="180" fill="#0F3C44"/>
  <text x="772" y="3742" fill="#F5C84A" font-size="40" font-weight="700">“</text>
  <text x="772" y="3766" fill="#ffffff" font-size="17">Je n’avais jamais travaillé avant. Aujourd’hui, j’ai</text>
  <text x="772" y="3792" fill="#ffffff" font-size="17">ma première fiche de paie. Ça me donne de la fierté.</text>
  <text x="772" y="3838" fill="#9FE1CB" font-size="13" font-weight="700">Cuisinier — Les Beaux Mets, 2025</text>

