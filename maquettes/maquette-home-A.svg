  <text x="740" y="1928" fill="#0D2B30" font-size="15" font-weight="700">13 antennes · 358 femmes en 2025 · 91 % de réussite aux diplômes</text>
  <text x="740" y="1972" fill="#1D6B78" font-size="15" font-weight="700">Découvrir →</text>

