    <rect x="700" y="1150" width="40" height="3" fill="#1D6B78"/>
    <text x="700" y="1188" fill="#0D2B30" font-size="21" font-weight="700">Insertion</text>
    <text x="700" y="1216" fill="#3D5E63" font-size="15">Accompagner des personnes éloignées de l’emploi vers des</text>
    <text x="700" y="1238" fill="#3D5E63" font-size="15">métiers porteurs, avec exigence et bienveillance.</text>

    <rect x="700" y="1276" width="40" height="3" fill="#1D6B78"/>
    <text x="700" y="1314" fill="#0D2B30" font-size="21" font-weight="700">Formation</text>
    <text x="700" y="1342" fill="#3D5E63" font-size="15">Certifier et professionnaliser, pour les publics en insertion</text>
    <text x="700" y="1364" fill="#3D5E63" font-size="15">comme pour les professionnels déjà en poste.</text>

    <rect x="700" y="1402" width="40" height="3" fill="#1D6B78"/>
    <text x="700" y="1440" fill="#0D2B30" font-size="21" font-weight="700">Transformation</text>
    <text x="700" y="1468" fill="#3D5E63" font-size="15">Plaider pour une restauration plus juste, plus inclusive,</text>
    <text x="700" y="1490" fill="#3D5E63" font-size="15">sans violence — à travers le mouvement Restaure.</text>
  </g>

