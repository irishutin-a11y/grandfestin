    <text x="96" y="2098" fill="#F0D9F3" font-size="12" letter-spacing="2" font-weight="700">DEPUIS 2015</text>
    <text x="96" y="2134" fill="#ffffff" font-size="22" font-weight="700">Des Étoiles et des Femmes</text>
    <text x="96" y="2166" fill="#EAD3EE" font-size="14">Insertion des femmes par la cuisine.</text>
    <text x="96" y="2216" fill="#ffffff" font-size="14" font-weight="700">91 % de réussite aux diplômes</text>

    <rect x="512" y="2050" width="416" height="210" fill="#8A4A98"/>
    <text x="544" y="2098" fill="#F0D9F3" font-size="12" letter-spacing="2" font-weight="700">DEPUIS 2022</text>
    <text x="544" y="2134" fill="#ffffff" font-size="22" font-weight="700">Les Beaux Mets</text>
    <text x="544" y="2166" fill="#EAD3EE" font-size="14">Le premier restaurant en prison</text>
