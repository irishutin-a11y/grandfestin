    <text x="96" y="1654" fill="#3D5E63" font-size="15">éloignées de l’emploi vers des</text>
    <text x="96" y="1676" fill="#3D5E63" font-size="15">métiers porteurs, avec exigence</text>
    <text x="96" y="1698" fill="#3D5E63" font-size="15">et bienveillance.</text>

    <rect x="512" y="1540" width="416" height="250" fill="#FEFCF8" stroke="#C9DDE0"/>
    <text x="544" y="1592" fill="#1D6B78" font-size="26" font-weight="700">Formation</text>
    <text x="544" y="1632" fill="#3D5E63" font-size="15">Certifier et professionnaliser,</text>
    <text x="544" y="1654" fill="#3D5E63" font-size="15">pour les publics en insertion</text>
    <text x="544" y="1676" fill="#3D5E63" font-size="15">comme pour les professionnels</text>
    <text x="544" y="1698" fill="#3D5E63" font-size="15">déjà en poste.</text>

    <rect x="960" y="1540" width="416" height="250" fill="#FEFCF8" stroke="#C9DDE0"/>
    <text x="992" y="1592" fill="#1D6B78" font-size="26" font-weight="700">Transformation</text>
    <text x="992" y="1632" fill="#3D5E63" font-size="15">Plaider pour une restauration</text>
    <text x="992" y="1654" fill="#3D5E63" font-size="15">plus juste, plus inclusive, sans</text>
    <text x="992" y="1676" fill="#3D5E63" font-size="15">violence — à travers le</text>
    <text x="992" y="1698" fill="#3D5E63" font-size="15">mouvement Restaure.</text>
  </g>

