    <text x="544" y="2226" fill="#ffffff" font-size="14" font-weight="700">86 % de sorties dynamiques</text>

    <rect x="960" y="2050" width="416" height="210" fill="#8A4A98"/>
    <text x="992" y="2098" fill="#F0D9F3" font-size="12" letter-spacing="2" font-weight="700">DEPUIS 1993</text>
    <text x="992" y="2134" fill="#ffffff" font-size="22" font-weight="700">La Table de Cana</text>
    <text x="992" y="2166" fill="#EAD3EE" font-size="14">Traiteur et restauration collective</text>
    <text x="992" y="2186" fill="#EAD3EE" font-size="14">en insertion.</text>
    <text x="992" y="2226" fill="#ffffff" font-size="14" font-weight="700">400 000+ convives régalés</text>

    <rect x="64" y="2290" width="640" height="200" fill="#8A4A98"/>
    <text x="96" y="2338" fill="#F0D9F3" font-size="12" letter-spacing="2" font-weight="700">DEPUIS 2024</text>
    <text x="96" y="2374" fill="#ffffff" font-size="22" font-weight="700">Le mouvement Restaure</text>
    <text x="96" y="2406" fill="#EAD3EE" font-size="14">Faire évoluer les pratiques de tout un secteur :</text>
    <text x="96" y="2426" fill="#EAD3EE" font-size="14">prévenir les violences, promouvoir un management juste.</text>
    <text x="96" y="2466" fill="#ffffff" font-size="14" font-weight="700">35 structures · 700 signataires · 2 M+ de vues</text>

    <rect x="736" y="2290" width="640" height="200" fill="#8A4A98"/>
    <text x="768" y="2338" fill="#F0D9F3" font-size="12" letter-spacing="2" font-weight="700">AVEC REFUGEE FOOD</text>
    <text x="768" y="2374" fill="#ffffff" font-size="22" font-weight="700">Tournesol</text>
    <text x="768" y="2406" fill="#EAD3EE" font-size="14">Formation diplômante pour personnes réfugiées</text>
    <text x="768" y="2426" fill="#EAD3EE" font-size="14">et primo-arrivantes.</text>
    <text x="768" y="2466" fill="#ffffff" font-size="14" font-weight="700">6 mois · TP Commis de cuisine · gratuite et rémunérée</text>
  </g>

