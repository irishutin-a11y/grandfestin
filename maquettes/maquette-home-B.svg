  <rect x="1288" y="28" width="88" height="34" rx="17" fill="#E8A825"/><text x="1332" y="50" text-anchor="middle" fill="#0D2B30" font-size="13" font-weight="700">Agir</text>

  <text x="64" y="222" fill="#F5C84A" font-size="15" letter-spacing="3" font-weight="700">ASSOCIATION FESTIN — DEPUIS 2015</text>
  <text x="60" y="322" fill="#ffffff" font-size="88" font-weight="700" letter-spacing="-2">La restauration comme</text>
  <text x="60" y="410" fill="#ffffff" font-size="88" font-weight="700" letter-spacing="-2">levier d’<tspan fill="#F5C84A" font-style="italic">insertion</tspan>, de</text>
  <text x="60" y="498" fill="#ffffff" font-size="88" font-weight="700" letter-spacing="-2"><tspan fill="#F5C84A" font-style="italic">formation</tspan> et de</text>
  <text x="60" y="586" fill="#ffffff" font-size="88" font-weight="700" letter-spacing="-2"><tspan fill="#F5C84A" font-style="italic">transformation</tspan>.</text>
  <text x="64" y="648" fill="#ffffff" fill-opacity="0.9" font-size="20">Le goût d’avancer ensemble.</text>
