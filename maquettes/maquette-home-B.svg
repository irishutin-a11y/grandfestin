    <text x="64" y="3458" fill="#CDE8D9" font-size="13" font-weight="700">PROMOTION DES ÉTOILES ET DES FEMMES, LILLE</text>

    <text x="740" y="3372" fill="#A8D6BD" font-size="52" font-weight="700">“</text>
    <text x="740" y="3392" fill="#ffffff" font-size="19">Ça m’a aidé à avoir confiance en mes compétences.</text>
    <text x="740" y="3420" fill="#ffffff" font-size="19">Aujourd’hui, j’ai un CDI. Je suis fier du chemin parcouru.</text>
    <text x="740" y="3458" fill="#CDE8D9" font-size="13" font-weight="700">ANCIEN SALARIÉ EN INSERTION — LA TABLE DE CANA</text>

    <text x="64" y="3540" fill="#A8D6BD" font-size="52" font-weight="700">“</text>
    <text x="64" y="3560" fill="#ffffff" font-size="19">Pour réussir à vraiment changer les choses, il faut avancer collectivement.</text>
    <text x="64" y="3598" fill="#CDE8D9" font-size="13" font-weight="700">ELOI SPINNLER — CHEF ENGAGÉ, MOUVEMENT RESTAURE</text>
