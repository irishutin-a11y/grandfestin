  <!-- ===== BLOC 3 — CRÈME : les 3 piliers ===== -->
  <rect x="0" y="1280" width="1440" height="560" fill="#F7F3EC"/>
  <text x="64" y="1372" fill="#1D6B78" font-size="14" letter-spacing="3" font-weight="700">L’ASSOCIATION FESTIN</text>
  <text x="62" y="1440" fill="#0D2B30" font-size="52" font-weight="700" letter-spacing="-1.5">Former, inclure, <tspan fill="#E8A825" font-style="italic">transformer.</tspan></text>
  <text x="64" y="1486" fill="#3D5E63" font-size="18">Née à Marseille en 2015, Festin fait de la cuisine un puissant levier d’émancipation.</text>
  <g>
