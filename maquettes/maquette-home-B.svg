  <text x="64" y="1932" fill="#F0D9F3" font-size="14" letter-spacing="3" font-weight="700">L’ÉCOSYSTÈME FESTIN</text>
  <text x="62" y="1996" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="-1">Cinq projets présentés à égalité</text>
  <g>
