  <g>
    <text x="64" y="3372" fill="#A8D6BD" font-size="52" font-weight="700">“</text>
    <text x="64" y="3392" fill="#ffffff" font-size="19">Je suis fière, indépendante, heureuse d’avoir su franchir</text>
