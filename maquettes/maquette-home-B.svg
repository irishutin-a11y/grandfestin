<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4360" viewBox="0 0 1440 4360" font-family="KoHo, 'Trebuchet MS', 'Segoe UI', sans-serif" role="img" aria-label="Maquette home Festin — Direction B : blocs de couleurs pleines alternées">
